name: MacDock
options:
  bundleIdPrefix: hq.nuncio
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
targets:
  MacDock:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - ScanHelper/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hq.nuncio.MacDock
        PRODUCT_NAME: MacDock
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: MacDockScanHelper
      - package: Sparkle
    postBuildScripts:
      - name: Embed scan helper
        script: |
          HELPER_SRC="$BUILT_PRODUCTS_DIR/MacDockScanHelper"
          HELPER_DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MacDockScanHelper"
          cp -f "$HELPER_SRC" "$HELPER_DST"
          codesign --force --sign "$CODE_SIGN_IDENTITY" \
            --options runtime --timestamp "$HELPER_DST" 2>/dev/null \
            || codesign --force --sign - "$HELPER_DST"
  MacDockScanHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ScanHelper
      - path: Sources/Shared
      - path: Sources/Modules/Monitor/DiskScanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hq.nuncio.MacDockScanHelper
        PRODUCT_NAME: MacDockScanHelper
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
